version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
            - npm-deps-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Type check
          command: ./node_modules/.bin/tsc --noEmit
      - run:
          name: Test
          command: npm test

workflows:
  build-and-test:
    jobs:
      - build-and-test
